name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-backend:
    name: Test Backend API
    runs-on: ubuntu-latest

    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "CIPassword@2025"
          MSSQL_PID: "Express"
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P CIPassword@2025 -C -Q 'SELECT 1' || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      # Install from ROOT — this installs all workspaces (api + web) in one go
      - name: Install dependencies
        run: npm install

      - name: Install SQL Server command line tools
        run: |
          curl https://packages.microsoft.com/keys/microsoft.asc | sudo tee /etc/apt/trusted.gpg.d/microsoft.asc
          curl https://packages.microsoft.com/config/ubuntu/22.04/prod.list | sudo tee /etc/apt/sources.list.d/mssql-release.list
          sudo apt-get update
          sudo ACCEPT_EULA=Y apt-get install -y mssql-tools18 unixodbc-dev
          echo "/opt/mssql-tools18/bin" >> $GITHUB_PATH

      - name: Create test database
        run: sqlcmd -S localhost -U sa -P "CIPassword@2025" -C -Q "CREATE DATABASE spendwise_test"

      - name: Setup database schema
        working-directory: apps/api
        env:
          DATABASE_URL: "sqlserver://localhost:1433;database=spendwise_test;user=sa;password=CIPassword@2025;trustServerCertificate=true"
        run: npx prisma db push

      - name: Seed database
        working-directory: apps/api
        env:
          DATABASE_URL: "sqlserver://localhost:1433;database=spendwise_test;user=sa;password=CIPassword@2025;trustServerCertificate=true"
        run: npx tsx prisma/seed.ts

      - name: Type check
        working-directory: apps/api
        run: npx tsc --noEmit

      - name: Run tests
        working-directory: apps/api
        env:
          NODE_ENV: test
          DATABASE_URL: "sqlserver://localhost:1433;database=spendwise_test;user=sa;password=CIPassword@2025;trustServerCertificate=true"
          JWT_SECRET: "ci-test-secret"
          JWT_EXPIRES_IN: "7d"
          CORS_ORIGIN: "http://localhost:3000"
          GEMINI_API_KEY: "not-needed-for-ci"
          CLOUDINARY_CLOUD_NAME: "not-needed-for-ci"
          CLOUDINARY_API_KEY: "not-needed-for-ci"
          CLOUDINARY_API_SECRET: "not-needed-for-ci"
        run: npx jest

  test-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      # Install from ROOT — same reasoning as above
      - name: Install dependencies
        run: npm install

      - name: Build frontend
        working-directory: apps/web
        env:
          NEXT_PUBLIC_API_URL: "http://localhost:5000"
        run: npm run build