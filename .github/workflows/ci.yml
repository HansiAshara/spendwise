name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-backend:
    name: Test Backend API
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: CIPassword2025
          POSTGRES_DB: spendwise_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      # Install from ROOT — this installs all workspaces (api + web) in one go
      - name: Install dependencies
        run: npm install

      - name: Setup database schema
        working-directory: apps/api
        env:
          DATABASE_URL: "postgresql://postgres:CIPassword2025@localhost:5432/spendwise_test"
        run: npx prisma db push

      - name: Seed database
        working-directory: apps/api
        env:
          DATABASE_URL: "postgresql://postgres:CIPassword2025@localhost:5432/spendwise_test"
        run: npx tsx prisma/seed.ts

      - name: Type check
        working-directory: apps/api
        run: npx tsc --noEmit

      - name: Run tests
        working-directory: apps/api
        env:
          NODE_ENV: test
          DATABASE_URL: "postgresql://postgres:CIPassword2025@localhost:5432/spendwise_test"
          JWT_SECRET: "ci-test-secret"
          JWT_EXPIRES_IN: "7d"
          CORS_ORIGIN: "http://localhost:3000"
          GEMINI_API_KEY: "not-needed-for-ci"
          CLOUDINARY_CLOUD_NAME: "not-needed-for-ci"
          CLOUDINARY_API_KEY: "not-needed-for-ci"
          CLOUDINARY_API_SECRET: "not-needed-for-ci"
        run: npx jest

  test-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      # Install from ROOT — same reasoning as above
      - name: Install dependencies
        run: npm install

      - name: Build frontend
        working-directory: apps/web
        env:
          NEXT_PUBLIC_API_URL: "http://localhost:5000"
        run: npm run build